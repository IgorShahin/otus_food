publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  go_router: ^14.2.0
  equatable: ^2.0.5
  flutter_bloc: ^8.1.6
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0
  retrofit: ^4.1.0
  dio: ^5.4.3+1
  dartz: ^0.10.1
  get_it: ^7.7.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  retrofit_generator: ^8.1.0

flutter:

  uses-material-design: true
  generate: true

assets:
  - assets/images/