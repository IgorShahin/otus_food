name: otus_food
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  go_router: ^14.6.1
  equatable: ^2.0.7
  flutter_bloc: ^8.1.6
  json_serializable: ^6.9.0
  json_annotation: ^4.9.0
  dio: ^5.7.0
  dartz: ^0.10.1
  get_it: ^8.0.2
  injectable: ^2.5.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  sentry_flutter: ^8.10.1
  freezed_annotation: ^2.4.4
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  flutter_gen_runner: ^5.8.0
  injectable_generator: ^2.6.2
  freezed: ^2.5.7
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  meta: ^1.16.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Medium.ttf
          weight: 500
        - asset: fonts/Roboto-Regular.ttf
          weight: 400


flutter_gen:
  output: lib/resources/
  line_length: 80
  integrations:
    flutter_svg: true