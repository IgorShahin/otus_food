name: otus_food
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  go_router: ^14.2.0
  equatable: ^2.0.5
  flutter_bloc: ^8.1.6
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0
  dio: ^5.5.0+1
  dartz: ^0.10.1
  get_it: ^7.7.0
  injectable: ^2.4.2
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  sentry_flutter: ^8.3.0
  freezed_annotation: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  flutter_gen_runner: ^5.6.0
  injectable_generator: ^2.6.1
  freezed: ^2.5.6

dependency_overrides:
  meta: ^1.15.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400


flutter_gen:
  output: lib/resources/
  line_length: 80
  integrations:
    flutter_svg: true